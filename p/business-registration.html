<script>
const API="https://script.google.com/macros/s/AKfycbwpMVP0rN61F7uVL1znqycdLCZ-Dlz7TWnHT9VdVjmXYFoTbJM48DN6clKN6SmSxRX2/exec";
function fileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function post(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const x=await r.json();if(!x||!x.success)throw Error(x&&x.error?x.error:'Submission failed.');return x}
function showChoice(){choice.style.display='grid';businessWrap.classList.remove('open');serviceWrap.classList.remove('open')}
function openBusiness(){choice.style.display='none';businessWrap.classList.add('open');serviceWrap.classList.remove('open');if(window.SCAccountUI)SCAccountUI.autofill(businessWrap)}
function openService(){choice.style.display='none';businessWrap.classList.remove('open');serviceWrap.classList.add('open');if(window.SCAccountUI)SCAccountUI.autofill(serviceWrap)}
async function imagePayload(input){
 const f=input&&input.files&&input.files[0];if(!f)return {};
 if(f.size>4*1024*1024)throw Error((localStorage.getItem('scLanguage')==='hi'?'फोटो 4 MB से कम रखें।':'Please use an image smaller than 4 MB.'));
 const data=await fileData(f);return {imageBase64:data,imageName:f.name,imageMimeType:f.type||'image/jpeg'}
}
businessForm.addEventListener('submit',async e=>{
 e.preventDefault();bStatus.className='status';bStatus.textContent=(localStorage.getItem('scLanguage')==='hi'?'अनुरोध भेजा जा रहा है...':'Submitting request...');
 try{
  const img=await imagePayload(bImage);
  const d={action:'registerBusiness',businessName:bName.value,'Business Name':bName.value,'Business Category':bCategory.value,'Owner Name':bOwner.value,'Contact Number':bPhone.value,'WhatsApp Number':bWhatsapp.value,'Ward':bWard.value,'Address':bAddress.value,'Description':bDescription.value,'WhatsApp Catalogue Link':bCatalogue.value,'Location':bMap.value,...img};
  await post(d);bStatus.className='status ok';bStatus.textContent=(localStorage.getItem('scLanguage')==='hi'?'अनुरोध एडमिन को भेज दिया गया है। स्वीकृति के बाद व्यवसाय लाइव होगा।':'Request sent to Admin. The business will go live after approval.');businessForm.reset();
 }catch(err){bStatus.className='status err';bStatus.textContent=err.message||'Submission failed.'}
});
serviceForm.addEventListener('submit',async e=>{
 e.preventDefault();sStatus.className='status';sStatus.textContent=(localStorage.getItem('scLanguage')==='hi'?'अनुरोध भेजा जा रहा है...':'Submitting request...');
 try{
  const img=await imagePayload(sImage);
  const d={action:'registerService',servicePersonName:sName.value,'Service Person Name':sName.value,serviceType:sCategory.value,'Service Type':sCategory.value,phone:sPhone.value,'Contact Number':sPhone.value,whatsapp:sWhatsapp.value,'WhatsApp Number':sWhatsapp.value,ward:sWard.value,address:sAddress.value,description:sDescription.value,'Work Description':sDescription.value,experience:sExperience.value,'Years of Experience':sExperience.value,location:sMap.value,'Location':sMap.value,...img};
  await post(d);sStatus.className='status ok';sStatus.textContent=(localStorage.getItem('scLanguage')==='hi'?'अनुरोध एडमिन को भेज दिया गया है। स्वीकृति के बाद सेवा लाइव होगी।':'Request sent to Admin. The service will go live after approval.');serviceForm.reset();
 }catch(err){sStatus.className='status err';sStatus.textContent=err.message||'Submission failed.'}
});</script>

<script>
(function(){
  const hidden=document.getElementById("bMap");
  const status=document.getElementById("bLocationStatus");
  const detect=document.getElementById("bDetectLocation");
  const select=document.getElementById("bSelectLocation");
  if(!hidden||!status||!detect||!select)return;
  function setLocation(lat,lng){
    hidden.value=String(lat)+","+String(lng);
    status.textContent=(localStorage.getItem('scLanguage')==='hi'?'स्थान चुना गया':'Location selected');
  }
  detect.onclick=function(){
    if(!navigator.geolocation){status.textContent="Location is not supported on this device.";return}
    status.textContent="Detecting location...";
    navigator.geolocation.getCurrentPosition(
      p=>setLocation(p.coords.latitude,p.coords.longitude),
      ()=>status.textContent="Unable to detect location. Please allow location permission.",
      {enableHighAccuracy:true,timeout:12000}
    );
  };
  select.onclick=function(){
    status.textContent=(localStorage.getItem('scLanguage')==='hi'?'स्थान प्राप्त किया जा रहा है...':'Getting location...');
    if(!navigator.geolocation){window.open('https://www.google.com/maps','_blank');return}
    navigator.geolocation.getCurrentPosition(function(p){setLocation(p.coords.latitude,p.coords.longitude);window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.coords.latitude+','+p.coords.longitude),'_blank')},function(){window.open('https://www.google.com/maps','_blank')},{enableHighAccuracy:true,timeout:12000});
  };
})();
</script>
<script>
(function(){
    const hidden=document.getElementById("sMap"),status=document.getElementById("sLocationStatus"),detect=document.getElementById("sDetectLocation"),select=document.getElementById("sSelectLocation"); if(!hidden||!status||!detect||!select)return;
    function setLoc(p){hidden.value=p.coords.latitude+","+p.coords.longitude;status.textContent=(localStorage.getItem('scLanguage')==='hi'?'स्थान चुना गया':'Location selected');}
    detect.onclick=function(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(setLoc,()=>status.textContent='Unable to detect location.',{enableHighAccuracy:true,timeout:12000})};
    select.onclick=function(){SCMapPicker.open(hidden,status)};
})();
</script>
<script>
(function scFocusRequestedResult(){
  const q=new URLSearchParams(location.search).get('focus'); if(!q)return;
  const needle=decodeURIComponent(q).trim().toLowerCase(); if(!needle)return;
  let tries=0; const timer=setInterval(function(){
    tries++; const nodes=[...document.querySelectorAll('article,.card,[class*=card],tr,li')];
    const hit=nodes.find(el=>(el.innerText||'').toLowerCase().includes(needle));
    if(hit){clearInterval(timer);hit.scrollIntoView({behavior:'smooth',block:'center'});hit.style.outline='3px solid #f28c28';hit.style.outlineOffset='3px';setTimeout(()=>{hit.style.outline='';hit.style.outlineOffset=''},3500)}
    else if(tries>20)clearInterval(timer);
  },250);
})();

 'Enter WhatsApp number':'व्हाट्सऐप नंबर दर्ज करें','Enter address':'पता दर्ज करें','Describe your business':'अपने व्यवसाय का विवरण लिखें',
 'Enter service provider name':'सेवा प्रदाता का नाम दर्ज करें','Describe the service':'सेवा का विवरण लिखें'};
 function apply(){
   if((localStorage.getItem('scLanguage')||'en')!=='hi')return;
   document.documentElement.lang='hi';
   document.querySelectorAll('[data-hi]').forEach(el=>{if(el.dataset.hi)el.textContent=el.dataset.hi});
   document.querySelectorAll('label,h1,h2,h3,p,button,option,span,small,b').forEach(el=>{const t=(el.textContent||'').trim();if(M[t]&&el.textContent!==M[t])el.textContent=M[t]});
   document.querySelectorAll('input,textarea').forEach(el=>{const x=(el.getAttribute('placeholder')||'').trim();if(P[x])el.setAttribute('placeholder',P[x])});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();
 window.addEventListener("storage",apply);
 document.addEventListener("change",function(e){if(e.target&&/language/i.test(e.target.id||""))setTimeout(apply,0)});
 setTimeout(apply,50);setTimeout(apply,300);document.addEventListener('click',function(e){if(e.target&&/business|service|type/i.test((e.target.id||'')+' '+(e.target.className||'')))setTimeout(apply,30)});
})();
</script></body></html>
