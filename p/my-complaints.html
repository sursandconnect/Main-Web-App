<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Complaints | Sursand Connect</title><style>body{margin:0;font-family:Arial;background:#f7f9fb;color:#263238;padding:18px 14px 90px}.top{display:flex;align-items:center;gap:10px}.top button{border:0;background:#fff0dd;border-radius:12px;padding:10px 14px}.card{background:#fff;border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 6px 20px #00000012;border-top:4px solid #f28c28}.card b{font-size:14px}.meta{font-size:10px;color:#667085;margin:6px 0}.empty{text-align:center;padding:50px 15px;color:#667085}.del{border:0;background:#fee2e2;color:#b91c1c;padding:8px 11px;border-radius:9px;font-weight:800;margin-top:9px}.new{display:block;text-align:center;text-decoration:none;background:#238b45;color:#fff;padding:13px;border-radius:13px;font-weight:800;margin:14px 0}</style><script src="../app-data.js"></script></head><body><div class="top"><button onclick="history.length>1?history.back():location.href='../'">←</button><h2 data-en="My Complaints" data-hi="मेरी शिकायतें">My Complaints</h2></div><a class="new" href="complaints.html" data-en="＋ New Complaint" data-hi="＋ नई शिकायत">＋ New Complaint</a><div id="list"></div><script>function draw(){let hi=localStorage.getItem('scLanguage')==='hi',a=[];try{a=JSON.parse(localStorage.getItem('scMyComplaints')||'[]')}catch(_){};list.innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.issue||x.category||''}</b><div class="meta">${x.no||''} • ${x.date||''} • ${hi?'वार्ड':'Ward'} ${x.ward||''}</div><div>${x.description||''}</div><div class="meta">${x.address||''}</div><button class="del" onclick="delComplaint(${a.indexOf(x)})">${hi?'हटाएं':'Delete'}</button></div>`).join(''):`<div class="empty">${hi?'इस डिवाइस पर अभी कोई शिकायत सहेजी नहीं गई है।':'No complaints have been saved on this device yet.'}</div>`}function delComplaint(i){let a=[];try{a=JSON.parse(localStorage.getItem('scMyComplaints')||'[]')}catch(_){};a.splice(i,1);localStorage.setItem('scMyComplaints',JSON.stringify(a));draw()}draw()</script><script src="../app-i18n.js"></script><script src="../app-enhancements.js"></script><script src="../universal-qr.js"></script></body></html>
